name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile, test and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Export OAuth certificate fingerprint
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android > Google-OAuth-certificate.txt
          cat Google-OAuth-certificate.txt
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SpaceSaver-0.2.0-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SpaceSaver-APK
          path: |
            SpaceSaver-0.2.0-debug.apk
            Google-OAuth-certificate.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-reports
          path: app/build/reports/
          retention-days: 14
